name: CI Check

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: terraform fmt (test)
        run: echo "terraform fmt -check -recursive ... OK"

      - name: terraform validate (test)
        run: echo "terraform validate ... OK"

      - name: tflint (test)
        run: echo "tflint --recursive ... OK"

      - name: tfsec (test)
        run: echo "tfsec . ... OK"

  plan-dev:
    name: "Plan (dev)"
    needs: lint
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: dev
      command: plan
      working-directory: test-infra/envs/dev

  plan-dr:
    name: "Plan (dr)"
    needs: lint
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: dr
      command: plan
      working-directory: test-infra/envs/dr

  plan-prd:
    name: "Plan (prd)"
    needs: lint
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: prd
      command: plan
      working-directory: test-infra/envs/prd
