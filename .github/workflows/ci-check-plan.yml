name: CI Check

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  branch-check:
    name: "Branch Policy"
    runs-on: ubuntu-latest
    steps:
      - name: main へは dev からのみマージ可
        if: github.base_ref == 'main' && github.head_ref != 'dev'
        run: |
          echo "::error::main へのマージは dev ブランチからのみ許可されています (source: ${{ github.head_ref }})"
          exit 1

  lint:
    name: "Lint"
    needs: branch-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: terraform fmt (test)
        run: echo "terraform fmt -check -recursive ... OK"

      - name: terraform validate (test)
        run: echo "terraform validate ... OK"

      - name: tflint (test)
        run: echo "tflint --recursive ... OK"

      - name: tfsec (test)
        run: echo "tfsec . ... OK"

  plan-dev:
    name: "Plan (dev)"
    if: github.base_ref == 'dev'
    needs: lint
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: dev
      command: plan
      working-directory: envs/dev

  plan-dr:
    name: "Plan (dr)"
    if: github.base_ref == 'main'
    needs: lint
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: dr
      command: plan
      working-directory: envs/dr

  plan-prd:
    name: "Plan (prd)"
    if: github.base_ref == 'main'
    needs: lint
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: prd
      command: plan
      working-directory: envs/prd
