name: CD Production

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ステップ1: DR環境へのデプロイ（手動承認が必要）
  apply-dr:
    name: "Apply (dr)"
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: dr
      command: apply
      working-directory: envs/dr

  # ステップ2: DR成功後、PRD環境へのデプロイ（手動承認が必要）
  apply-prd:
    name: "Apply (prd)"
    needs: apply-dr
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: prd
      command: apply
      working-directory: envs/prd
